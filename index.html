// ── RESPONSIVE ───────────────────────────────────────────────────────────────
// Hook simple pour basculer les styles inline (grid, paddings, tailles) entre
// desktop et mobile (< 768px). Pas de librairie externe.
function useIsMobile() {
  const [isMobile, setIsMobile] = React.useState(
    () => typeof window !== 'undefined' && window.matchMedia('(max-width:768px)').matches
  );
  React.useEffect(() => {
    const mq = window.matchMedia('(max-width:768px)');
    const onChange = e => setIsMobile(e.matches);
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
    return () => {
      mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange);
    };
  }, []);
  return isMobile;
}

async function editSha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function editB64DecodeUnicode(str) {
  const binary = atob(str.replace(/\n/g,''));
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function editB64EncodeUnicode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

// Upload d'une image choisie par Abdel vers le dépôt GitHub (dossier uploads/),
// puis renvoie l'URL jsDelivr correspondante (CDN gratuit qui sert directement
// les fichiers d'un dépôt GitHub public, plus rapide/fiable que raw.githubusercontent.com).
// Redimensionne (max 1600px sur le plus grand côté) et recompresse en JPEG
// qualité 85% avant upload — les photos venant d'un téléphone ou d'un outil
// IA pèsent souvent 2-4 Mo, ce qui ralentit beaucoup le chargement du site.
async function resizeImageForWeb(file, maxDim, quality) {
  const bitmap = await createImageBitmap(file).catch(() => null);
  if (!bitmap) return file; // format non supporté par createImageBitmap : on envoie tel quel
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // fond blanc si transparence (JPEG ne supporte pas l'alpha)
  ctx.drawImage(bitmap, 0, 0, w, h);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
  return blob || file;
}

async function uploadImageToGitHub(file, token) {
  const safeBase = file.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'image';
  const resized = await resizeImageForWeb(file, 1600, 0.85);
  const safeName = safeBase + '.jpg';
  const path = 'uploads/' + Date.now() + '-' + safeName;
  const dataUrl = await new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(resized);
  });
  const base64 = dataUrl.split(',')[1];
  const res = await fetch('https://api.github.com/repos/' + EDIT_REPO + '/contents/' + path, {
    method: 'PUT',
    headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify({ message: 'Upload image via édition en direct — ' + path, content: base64 }),
  });
  if (!res.ok) {
    const body = await res.text().catch(()=> '');
    console.error('GitHub upload failed', res.status, body);
    throw new Error('github-upload-failed-' + res.status);
  }
  return 'https://cdn.jsdelivr.net/gh/' + EDIT_REPO + '@main/' + path;
}

// Usage le plus courant : <Edit k="hero_title">{d.hero_title}</Edit>
// Usage sur mesure (champ imbriqué, ex. catégories/produits) :
//   <Edit value={x} onCommit={v=>...}>{aperçu affiché}</Edit>
// Hors mode édition : renvoie EXACTEMENT `children`, sans aucun wrapper DOM,
// aucun style, aucun appel réseau ni localStorage.
function Edit({k, value, onCommit, multiline, children}) {
  const ctx = useEditCtx();
  const [active, setActive] = React.useState(false);
  if (!ctx || !ctx.editMode) return children;
  const current = k !== undefined ? ctx.draft[k] : value;
  function commit(text) {
    if (onCommit) onCommit(text); else ctx.setField(k, text);
  }
  if (active) {
    const common = {
      autoFocus: true,
      defaultValue: current,
      onClick: e => e.stopPropagation(),
      onBlur: e => { commit(e.target.value); setActive(false); },
      onKeyDown: e => { if (e.key === 'Escape') setActive(false); if (e.key === 'Enter' && !multiline) e.target.blur(); },
      style: {font:'inherit', color:'inherit', letterSpacing:'inherit', textTransform:'inherit', background:'#fff', border:'1px dashed #4C8BF5', outline:'none', width:'100%', minWidth:60, boxSizing:'border-box', resize: multiline?'vertical':'none'},
    };
    return multiline ? <textarea rows={3} {...common}/> : <input {...common}/>;
  }
  return (
    <span onClick={e => { e.stopPropagation(); setActive(true); }} title="Cliquer pour modifier"
      style={{outline:'1px dashed rgba(76,139,245,.55)', outlineOffset:2, cursor:'text', background:'rgba(76,139,245,.07)'}}>
      {children}
    </span>
  );
}

    } catch (err) {
      console.error(err);
      alert("Échec de l'envoi de la photo. Vérifiez la connexion et le token GitHub.");
    } finally {
      setBusy(false);
    }
  }
  return (
    <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} onClick={e=>e.stopPropagation()}
      style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:hover?'rgba(44,36,25,.55)':'transparent',transition:'background .15s',zIndex:5}}>
      {hover && (
        <button type="button" disabled={busy} onClick={()=>inputRef.current && inputRef.current.click()}
          style={{background:'#fff',color:'#2C2419',border:'none',padding:'8px 14px',fontSize:11,fontFamily:"'Jost',sans-serif",letterSpacing:'.06em',textTransform:'uppercase',cursor:busy?'default':'pointer',fontWeight:600}}>
          {busy ? 'Envoi…' : 'Changer la photo'}
        </button>
      )}
      <input ref={inputRef} type="file" accept="image/*" style={{display:'none'}} onChange={onFile}/>
    </div>
  );
}

// ── Fournisseur du mode édition ──────────────────────────────────────────────
function EditModeProvider({children}) {
  const [editMode, setEditMode] = React.useState(false);
  const [draft, setDraft] = React.useState(TWEAK_DEFAULTS);
  const [token, setToken] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [loginError, setLoginError] = React.useState('');
  const [publishing, setPublishing] = React.useState(false);
  const [publishMsg, setPublishMsg] = React.useState(null);
  const loadedRef = React.useRef(null); // JSON du contenu tel que chargé depuis GitHub (détecte les changements non publiés)
  const autoResumeTried = React.useRef(false);

  async function enterEditMode(tok) {
    setLoading(true); setLoginError('');
    try {
      const { content, sha: freshSha } = await editFetchIndexHtml(tok);
      const obj = editExtractTweakBlock(content);
      setDraft(obj);
      loadedRef.current = JSON.stringify(obj);
      setEditMode(true);
    } catch (e) {
      console.error(e);
      setLoginError("Impossible de récupérer le contenu actuel du site. Vérifiez la connexion et le token GitHub.");
    } finally {
      setLoading(false);
    }
  }

  // Reprend automatiquement une session d'édition déjà ouverte sur cet
  // appareil (localStorage) — appelé uniquement depuis EditLauncher, jamais
  // au premier rendu de l'app pour un visiteur qui n'a jamais ouvert le
  // panneau d'édition.
  function tryAutoResume() {
    if (autoResumeTried.current) return;
    autoResumeTried.current = true;
    let authed = false, tok = '';
    try {
      authed = localStorage.getItem(EDIT_LS_AUTH) === '1';
      tok = localStorage.getItem(EDIT_LS_TOKEN) || '';
    } catch (e) {}
    if (authed && tok) { setToken(tok); enterEditMode(tok); }
  }

  async function login(password, tok) {
    setLoginError('');
    const hash = await editSha256(password);
    if (hash !== EDIT_ADMIN_HASH) { setLoginError('Mot de passe incorrect.'); return; }
    if (!tok || !tok.trim()) { setLoginError('Collez votre token GitHub (voir les instructions ci-dessous) pour continuer.'); return; }
    const cleanTok = tok.trim();
    try { localStorage.setItem(EDIT_LS_TOKEN, cleanTok); localStorage.setItem(EDIT_LS_AUTH, '1'); } catch (e) {}
    setToken(cleanTok);
    await enterEditMode(cleanTok);
  }

  function logout() {
    const dirty = loadedRef.current !== null && loadedRef.current !== JSON.stringify(draft);
    if (dirty && !confirm('Des changements ne sont pas encore publiés. Quitter le mode édition sans publier ?')) return;
    try { localStorage.removeItem(EDIT_LS_AUTH); } catch (e) {}
    setEditMode(false);
    setDraft(TWEAK_DEFAULTS);
    setPublishMsg(null);
  }

  function setField(key, value) { setDraft(d => ({...d, [key]: value})); }
  function updateCategoryField(id, field, value) {
    setDraft(d => ({...d, categories: d.categories.map(c => c.id===id ? {...c, [field]: value} : c)}));
  }
  function updateProduct(id, patch) {
    setDraft(d => ({...d, products: d.products.map(p => p.id===id ? {...p, ...patch} : p)}));
  }
  function setProductImage(product, url) {
    if (product.img) setField('img_' + product.img, url);
    else updateProduct(product.id, {imgUrl: url});
  }
  function addProductImages(product, urls) {
    if (!urls || !urls.length) return;
    setDraft(d => ({...d, products: d.products.map(p => {
      if (p.id !== product.id) return p;
      const base = (p.images && p.images.length) ? p.images.slice() : [p.img || p.imgUrl].filter(Boolean);
      return {...p, images: base.concat(urls)};
    })}));
  }
  function removeProductImage(product, index) {
    setDraft(d => ({...d, products: d.products.map(p => {
      if (p.id !== product.id) return p;
      if (!p.images) return p;
      const next = p.images.filter((_,i)=>i!==index);
      return {...p, images: next.length>1 ? next : undefined, img: next.length===1 ? next[0] : p.img, imgUrl: next.length===1 ? '' : p.imgUrl};
    })}));
  }
  function slugify(s) {
    return (s||'produit').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  }
  // Transforme un produit sans variante en groupe de 2 couleurs (la couleur
  // actuelle + la nouvelle) — premier ajout de couleur sur ce produit.
  function addFirstColorVariant(product, {currentLabel, currentHex, label, hex}) {
    setDraft(d => {
      const baseName = product.baseName || product.name;
      const groupId = slugify(baseName) + '_' + Date.now();
      const maxId = d.products.reduce((m,p)=>Math.max(m,p.id),0);
      const newVariant = {...product, id: maxId+1, baseName, group: groupId, colorLabel: label, colorHex: hex, name: baseName+' — '+label};
      const products = d.products.map(p => p.id===product.id
        ? {...p, baseName, group: groupId, colorLabel: currentLabel, colorHex: currentHex, name: baseName+' — '+currentLabel}
        : p
      ).concat([newVariant]);
      return {...d, products};
    });
  }
  // Ajoute une couleur de plus à un groupe de variantes déjà existant.
  function addColorVariant(product, {label, hex}) {
    setDraft(d => {
      const baseName = product.baseName;
      const maxId = d.products.reduce((m,p)=>Math.max(m,p.id),0);
      const newVariant = {...product, id: maxId+1, colorLabel: label, colorHex: hex, name: baseName+' — '+label};
      return {...d, products: d.products.concat([newVariant])};
    });
  }
  // Retire une couleur. S'il n'en reste qu'une seule, le groupe est dissous
  // et le produit redevient un article simple (sans variante).
  function removeColorVariant(variant) {
    setDraft(d => {
      const groupMembers = d.products.filter(p => p.group === variant.group);
      if (groupMembers.length <= 2) {
        const keep = groupMembers.find(p => p.id !== variant.id);
        return {...d, products: d.products
          .filter(p => p.id !== variant.id)
          .map(p => p.id === keep.id
            ? {...p, group: undefined, colorLabel: undefined, colorHex: undefined, name: p.baseName || p.name, baseName: undefined}
            : p)};
      }
      return {...d, products: d.products.filter(p => p.id !== variant.id)};
    });
  }
  function reorderProduct(id, dir) {
    setDraft(d => {
      const list = d.products.slice();
      const idx = list.findIndex(p=>p.id===id);
      const j = idx + dir;
      if (idx<0 || j<0 || j>=list.length) return d;
      [list[idx], list[j]] = [list[j], list[idx]];
      return {...d, products: list};
    });
  }
  function deleteProduct(id) {
    setDraft(d => ({...d, products: d.products.filter(p=>p.id!==id)}));
  }
  function addProduct({name, price, cat, imgUrl}) {
    setDraft(d => {
      const maxId = d.products.reduce((m,p)=>Math.max(m,p.id),0);
      const newProduct = {id:maxId+1, cat, name:name||'Nouvel article', price:price||'', tag:'', img:'', stock:1, desc:'', imgUrl:imgUrl||''};
      return {...d, products: d.products.concat([newProduct])};
    });
  }
  function reorderSection(id, dir) {
    setDraft(d => {
      const list = d.home_sections.slice();
      const idx = list.indexOf(id);
      const j = idx + dir;
      if (idx<0 || j<0 || j>=list.length) return d;
      [list[idx], list[j]] = [list[j], list[idx]];
      return {...d, home_sections: list};
    });
  }
  async function uploadImage(file) { return uploadImageToGitHub(file, token); }

  async function publish() {
    setPublishing(true); setPublishMsg(null);
    try {
      // On relit le fichier juste avant de publier pour récupérer le sha le
      // plus récent (évite un conflit si le fichier a changé entre-temps),
      // exactement comme le fait admin.html.
      const { content: freshHtml, sha: freshSha } = await editFetchIndexHtml(token);
      const newHtml = editReinjectTweakBlock(freshHtml, draft);
      await editPublishIndexHtml(token, newHtml, freshSha);
      loadedRef.current = JSON.stringify(draft);
      setPublishMsg({type:'ok', text:'Publié ! Le site sera à jour sur locawedding.be dans 1 à 2 minutes.'});
    } catch (e) {
      console.error(e);
      setPublishMsg({type:'error', text:"La publication a échoué. Vérifiez la connexion et le token GitHub (il doit avoir le droit d'écrire sur le dépôt), puis réessayez."});
    } finally {
      setPublishing(false);
    }
  }

  const value = {
    editMode, draft, loading, loginError, publishing, publishMsg, token,
    tryAutoResume, login, logout, setField, updateCategoryField,
    updateProduct, setProductImage, addProductImages, removeProductImage, reorderProduct, deleteProduct, addProduct,
    addFirstColorVariant, addColorVariant, removeColorVariant,
    reorderSection, uploadImage, publish,
  };
  return <EditCtx.Provider value={value}>{children}</EditCtx.Provider>;
}

// ── Bouton crayon discret + panneau de connexion (toujours rendu, même pour
// un visiteur normal — c'est le seul ajout visible hors mode édition) ────────
function EditLauncher() {
  const ctx = useEditCtx();
  const [open, setOpen] = React.useState(false);
  const [pwd, setPwd] = React.useState('');
  const [tok, setTok] = React.useState('');
  const triedRef = React.useRef(false);

  React.useEffect(() => {
    if (!triedRef.current) { triedRef.current = true; ctx && ctx.tryAutoResume(); }
  }, []);

  if (!ctx || ctx.editMode) return null; // la barre d'outils remplace ce bouton en mode édition

  // Le bouton crayon reste invisible pour tout le monde sauf : 1) un navigateur
  // déjà connecté une fois (session mémorisée dans localStorage), ou 2) une
  // visite avec ?edit=1 dans l'URL (connu d'Abdel seulement). Un visiteur
  // normal ne voit donc jamais ce bouton.
  let alreadyAuthed = false;
  try { alreadyAuthed = localStorage.getItem(EDIT_LS_AUTH) === '1'; } catch (e) {}
  let hasSecretParam = false;
  try { hasSecretParam = new URLSearchParams(window.location.search).get('edit') === '1'; } catch (e) {}
  if (!alreadyAuthed && !hasSecretParam) return null;

  async function submit() { await ctx.login(pwd, tok); }

  return (
    <div style={{position:'fixed',bottom:18,right:18,zIndex:9999}}>
      {open && (
        <div style={{position:'absolute',bottom:52,right:0,width:320,maxWidth:'calc(100vw - 36px)',background:'#fff',border:'1px solid #EDE4D8',boxShadow:'0 10px 40px rgba(44,36,25,.18)',padding:'22px 20px',fontFamily:"'Jost',sans-serif"}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,fontWeight:600,color:'#2C2419',margin:'0 0 14px'}}>Mode édition</p>
          <label style={{display:'block',fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#9E8B78',fontWeight:600,marginBottom:5}}>Mot de passe admin</label>
          <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} style={{width:'100%',padding:'8px 10px',border:'1px solid #EDE4D8',marginBottom:12,fontSize:13,boxSizing:'border-box'}}/>
          <label style={{display:'block',fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#9E8B78',fontWeight:600,marginBottom:5}}>Token GitHub (Personal Access Token)</label>
          <input type="password" value={tok} onChange={e=>setTok(e.target.value)} style={{width:'100%',padding:'8px 10px',border:'1px solid #EDE4D8',marginBottom:6,fontSize:13,boxSizing:'border-box'}}/>
          <p style={{fontSize:10,color:'#9E8B78',marginBottom:12}}>Collé une seule fois : il reste stocké dans ce navigateur uniquement.</p>
          {ctx.loginError && <div style={{background:'#FBF1F0',border:'1px solid #C4877A',color:'#8B3A2A',padding:'8px 10px',fontSize:11,marginBottom:12}}>{ctx.loginError}</div>}
          <button onClick={submit} disabled={ctx.loading} style={{width:'100%',padding:'11px',background:'#8A9E7E',color:'#fff',border:'none',cursor:ctx.loading?'default':'pointer',fontSize:12,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,opacity:ctx.loading?.6:1}}>
            {ctx.loading ? 'Connexion…' : 'Entrer en mode édition'}
          </button>
          <details style={{marginTop:16,fontSize:11,color:'#6B5C48',lineHeight:1.6}}>
            <summary style={{cursor:'pointer',color:'#8A9E7E',fontWeight:600}}>Comment obtenir mon token GitHub ?</summary>
            <ol style={{paddingLeft:16,marginTop:8}}>
              <li>Allez sur <strong>github.com</strong>, connectez-vous avec le compte qui possède le dépôt <code>loca-wedding-site</code>.</li>
              <li>Cliquez sur votre photo de profil (en haut à droite) → <strong>Settings</strong>.</li>
              <li>Dans le menu de gauche, tout en bas : <strong>Developer settings</strong>.</li>
              <li><strong>Personal access tokens</strong> → <strong>Tokens (classic)</strong> → <strong>Generate new token (classic)</strong>.</li>
              <li>Donnez-lui un nom (ex: "Édition directe Loca-Wedding"), une expiration (ex: 90 jours), et cochez la case <strong>repo</strong>.</li>
              <li>Cliquez sur <strong>Generate token</strong> en bas de page. GitHub affiche le token UNE SEULE FOIS — copiez-le immédiatement.</li>
              <li>Collez-le dans le champ "Token GitHub" ci-dessus.</li>
            </ol>
          </details>
        </div>
      )}
      <button onClick={()=>setOpen(o=>!o)} title="Mode édition" aria-label="Mode édition"
        style={{width:44,height:44,borderRadius:'50%',border:'none',cursor:'pointer',background:'rgba(44,36,25,.35)',color:'#fff',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',opacity:.42,transition:'opacity .2s'}}
        onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.42}>
        ✎
      </button>
    </div>
  );
}

// ── Tuile « + » : ajout rapide d'un article au catalogue ─────────────────────
function AddProductTile({categories, onAdd}) {
  const [open, setOpen] = React.useState(false);
  const [name, setName] = React.useState('');
  const [price, setPrice] = React.useState('');
  const [cat, setCat] = React.useState(categories[0] ? categories[0].id : '');
  const [imgUrl, setImgUrl] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const ctx = useEditCtx();
  const inputRef = React.useRef(null);

  async function onFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !ctx) return;
    setBusy(true);
    try { setImgUrl(await ctx.uploadImage(file)); }
    catch (err) { console.error(err); alert("Échec de l'envoi de la photo."); }
    finally { setBusy(false); }
  }
  function submit() {
    onAdd({name: name||'Nouvel article', price, cat, imgUrl});
    setName(''); setPrice(''); setImgUrl(''); setOpen(false);
  }

  if (!open) {
    return (
      <button onClick={()=>setOpen(true)} style={{minHeight:260,border:'2px dashed #DFC49A',background:'#FAFAF8',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:34,color:'#C9A96E'}}>+</button>
    );
  }
  return (
    <div style={{border:'1px solid #EDE4D8',background:'#fff',padding:16,display:'flex',flexDirection:'column',gap:8}}>
      <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,fontWeight:600,margin:0}}>Nouvel article</p>
      <input placeholder="Nom" value={name} onChange={e=>setName(e.target.value)} style={{padding:'8px 10px',border:'1px solid #EDE4D8',fontSize:12}}/>
      <input placeholder="Prix (ex: 25€/j)" value={price} onChange={e=>setPrice(e.target.value)} style={{padding:'8px 10px',border:'1px solid #EDE4D8',fontSize:12}}/>
      <select value={cat} onChange={e=>setCat(e.target.value)} style={{padding:'8px 10px',border:'1px solid #EDE4D8',fontSize:12}}>
        {categories.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
      </select>
      <button type="button" onClick={()=>inputRef.current && inputRef.current.click()} disabled={busy} style={{padding:'8px 10px',border:'1px solid #EDE4D8',background:'#F5EFE6',fontSize:11,cursor:'pointer'}}>{busy?'Envoi…':(imgUrl?'Photo ajoutée ✓':'Ajouter une photo')}</button>
      <input ref={inputRef} type="file" accept="image/*" style={{display:'none'}} onChange={onFile}/>
      {imgUrl && <img src={imgUrl} alt="" style={{width:'100%',height:100,objectFit:'cover'}}/>}
      <div style={{display:'flex',gap:8,marginTop:4}}>
        <button onClick={submit} style={{flex:1,padding:'9px',background:'#8A9E7E',color:'#fff',border:'none',cursor:'pointer',fontSize:11,textTransform:'uppercase',fontWeight:600}}>Ajouter</button>
        <button onClick={()=>setOpen(false)} style={{padding:'9px 14px',background:'none',border:'1px solid #EDE4D8',cursor:'pointer',fontSize:11}}>Annuler</button>
      </div>
    </div>
  );
}

// ── SHARED COMPONENTS ─────────────────────────────────────────────────────────
function Btn({children, onClick, variant='solid', style={}, full=false, disabled=false}) {
  const [h,sH] = React.useState(false);
  const base = {border:'none',cursor:disabled?'default':'pointer',fontFamily:"'Jost',sans-serif",fontSize:12,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:600,padding:'12px 28px',transition:'all .2s',width:full?'100%':'auto',opacity:disabled?.5:1,...style};
  const s = {
    solid:   {background:h&&!disabled?G.goldD:G.gold,   color:'#fff',...base},
    outline: {background:'transparent',color:h?G.textL:G.textL,border:'1px solid '+(h?G.sage:G.beigeD),...base},
    sage:    {background:h&&!disabled?'#6B8B61':G.sage,  color:'#fff',...base},
  };
  return <button disabled={disabled} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} onClick={onClick} style={s[variant]}>{children}</button>;
}

function SectionTitle({eyebrow, title, sub, align='center', light=false}) {
  return (
    <div style={{textAlign:align, marginBottom:50}}>
      {eyebrow && <p style={{fontFamily:"'Jost',sans-serif",fontSize:11,letterSpacing:'.22em',textTransform:'uppercase',color:light?G.goldL:G.gold,fontWeight:600,margin:'0 0 12px'}}>{eyebrow}</p>}

// ── Galerie photo éditable (ajouter plusieurs photos / en supprimer une) ────
function ModalGalleryEditor({product, photos, pi, setPi, onAdd, onRemove}) {
  const [busy, setBusy] = React.useState(false);
  const inputRef = React.useRef(null);
  const ctx = useEditCtx();
  async function onFiles(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length || !ctx) return;
    setBusy(true);
    try {
      const urls = [];
      for (const f of files) urls.push(await uploadImageToGitHub(f, ctx.token));
      onAdd(urls);
    } catch (err) {
      console.error(err);
      alert("Échec de l'envoi d'une ou plusieurs photos. Vérifiez la connexion et le token GitHub.");
    } finally {
      setBusy(false);
    }
  }
  return (
    <div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:12,left:12,display:'flex',gap:6,alignItems:'center'}}>
      <button type="button" disabled={busy} onClick={()=>inputRef.current && inputRef.current.click()}
        style={{background:'#fff',color:'#2C2419',border:'none',padding:'7px 12px',fontSize:11,fontFamily:"'Jost',sans-serif",letterSpacing:'.04em',textTransform:'uppercase',cursor:busy?'default':'pointer',fontWeight:600}}>
        {busy ? 'Envoi…' : '+ Ajouter des photos'}
      </button>
      {photos.length>1 && (
        <button type="button" onClick={()=>onRemove(pi)}
          style={{background:'rgba(196,135,122,.92)',color:'#fff',border:'none',padding:'7px 10px',fontSize:11,fontFamily:"'Jost',sans-serif",cursor:'pointer',fontWeight:600}}>
          Retirer cette photo
        </button>
      )}
      <input ref={inputRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={onFiles}/>
    </div>
  );
}

// ── Ajout d'une variante couleur (mode édition) ──────────────────────────────
function ColorVariantAdder({product, isFirst, onAddFirst, onAdd}) {
  const [open, setOpen] = React.useState(false);
  const [currentLabel, setCurrentLabel] = React.useState('Original');
  const [currentHex, setCurrentHex] = React.useState('#C9A96E');
  const [label, setLabel] = React.useState('');
  const [hex, setHex] = React.useState('#8A9E7E');

  function submit() {
    if (!label.trim()) return;
    if (isFirst) onAddFirst({currentLabel: currentLabel.trim() || 'Original', currentHex, label: label.trim(), hex});
    else onAdd({label: label.trim(), hex});
    setLabel('');
    setOpen(false);
  }

  if (!open) {
    return (
      <button type="button" onClick={()=>setOpen(true)}
        style={{height:26,padding:'0 12px 0 6px',borderRadius:999,border:'1.5px dashed '+G.sage,background:'#fff',color:G.sage,cursor:'pointer',fontSize:11,fontFamily:"'Jost',sans-serif",fontWeight:700,textTransform:'uppercase',letterSpacing:'.03em',display:'flex',alignItems:'center',gap:4}}
        title="Ajouter une couleur">
        <span style={{width:16,height:16,borderRadius:'50%',background:G.sage,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,lineHeight:1}}>+</span>
        Ajouter une couleur
      </button>
    );
  }
  return (
    <div style={{background:'#fff',border:'1px solid '+G.beigeD,padding:14,display:'flex',flexDirection:'column',gap:10,width:220,boxShadow:'0 6px 20px rgba(44,36,25,.12)'}}>
      {isFirst && (
        <div>
          <label style={{display:'block',fontSize:10,color:G.textM,marginBottom:4}}>Couleur actuelle (celle déjà en ligne)</label>
          <div style={{display:'flex',gap:6}}>
            <input type="color" value={currentHex} onChange={e=>setCurrentHex(e.target.value)} style={{width:30,height:30,border:'none',padding:0,cursor:'pointer'}}/>
            <input type="text" value={currentLabel} onChange={e=>setCurrentLabel(e.target.value)} placeholder="Ex: Blanc"
              style={{flex:1,padding:'6px 8px',border:'1px solid '+G.beigeD,fontSize:12}}/>
          </div>
        </div>
      )}
      <div>
        <label style={{display:'block',fontSize:10,color:G.textM,marginBottom:4}}>Nouvelle couleur</label>
        <div style={{display:'flex',gap:6}}>
          <input type="color" value={hex} onChange={e=>setHex(e.target.value)} style={{width:30,height:30,border:'none',padding:0,cursor:'pointer'}}/>
          <input type="text" value={label} onChange={e=>setLabel(e.target.value)} placeholder="Ex: Doré" autoFocus
            style={{flex:1,padding:'6px 8px',border:'1px solid '+G.beigeD,fontSize:12}}/>
        </div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button type="button" onClick={submit} style={{flex:1,padding:'8px',background:G.sage,color:'#fff',border:'none',fontSize:11,cursor:'pointer',fontWeight:600,textTransform:'uppercase'}}>Ajouter</button>
        <button type="button" onClick={()=>setOpen(false)} style={{padding:'8px 12px',background:'none',border:'1px solid '+G.beigeD,fontSize:11,cursor:'pointer'}}>Annuler</button>
      </div>
    </div>
  );
}

// CATALOGUE
// ═══════════════════════════════════════════════════════════════════════════════
function CataloguePage({setPage, initialCat='all', addToCart}) {
  const isMobile = useIsMobile();
  const [cat, setCat] = React.useState(initialCat);
  const [search, setSearch] = React.useState('');
  const [modal, setModal] = React.useState(null);
  const [tagFilter, setTagFilter] = React.useState('');
  const d = useContent();
  const IMGS = useImgs();
  const PRODUCTS = useProducts();
  const CATEGORIES = d.categories;
  const editCtx = useEditCtx();
  const editMode = !!(editCtx && editCtx.editMode);
  const counts = React.useMemo(()=>{
    const c={all:PRODUCTS.length};
    CATEGORIES.forEach(ct=>c[ct.id]=PRODUCTS.filter(p=>p.cat===ct.id).length);
    return c;
  },[PRODUCTS, CATEGORIES]);
  const filtered = PRODUCTS.filter(p => {
    const mc = cat==='all'||p.cat===cat;
    const ms = !search||p.name.toLowerCase().includes(search.toLowerCase())||p.desc.toLowerCase().includes(search.toLowerCase());
    const mt = !tagFilter||p.tag===tagFilter;
    return mc&&ms&&mt;
  });
  // Une carte par produit/modèle : les couleurs d'un même groupe partagent une seule carte.
  const cardGroups = [];
  const seenGroups = new Set();
  filtered.forEach(p => {
    const k = p.group||('single-'+p.id);
    if (seenGroups.has(k)) return;
    seenGroups.add(k);
    cardGroups.push(p);
  });
  return (
    <div style={{paddingTop:0,minHeight:'100vh',background:G.cream}}>

function DevisPage({cart={}, setCartQty=()=>{}, clearCart=()=>{}}) {
  const isMobile = useIsMobile();
  const d = useContent();
  const IMGS = useImgs();
  const PRODUCTS = useProducts();
  const [f,setF] = React.useState({nom:'',email:'',tel:'',date:'',lieu:'',invites:'',msg:''});
  const [sent,setSent] = React.useState(false);
  const [submitting,setSubmitting] = React.useState(false);
  const [submitError,setSubmitError] = React.useState('');
  const [openCat,setOpenCat] = React.useState(null);
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const inp = {width:'100%',padding:'10px 12px',border:'1px solid '+G.beigeD,background:'#fff',fontFamily:"'Jost',sans-serif",fontSize:13,color:G.text,outline:'none',boxSizing:'border-box'};
  const lbl = {fontFamily:"'Jost',sans-serif",fontSize:10,letterSpacing:'.14em',textTransform:'uppercase',color:G.textM,fontWeight:600,display:'block',marginBottom:5};

  const cartItems = Object.entries(cart)
    .map(([id,qty]) => ({product: PRODUCTS.find(p=>p.id===Number(id)), qty}))
    .filter(it => it.product);
  const cartCount = cartItems.reduce((s,it)=>s+it.qty,0);
  const canSubmit = f.nom.trim() && f.email.trim() && f.date && cartItems.length>0 && !submitting;

  async function handleSubmit() {
    if (!canSubmit) return;
    setSubmitError('');
    if (!SB) { setSubmitError("La prise de devis en ligne n'est pas encore activée sur le site — merci de nous contacter directement en attendant."); return; }
    setSubmitting(true);
    try {
      // L'id est genere cote client : un visiteur anonyme peut inserer un devis
      // mais n'a pas le droit de le relire (RLS), donc on ne peut pas compter
      // sur .select() apres l'insert pour recuperer l'id genere par la base.
      const quoteId = crypto.randomUUID();
      const { error: qErr } = await SB.from('quotes').insert({
        id: quoteId,
        customer_name: f.nom, customer_email: f.email, customer_phone: f.tel || null,
        event_date: f.date, venue_location: f.lieu || null,
        guest_count: f.invites ? parseInt(f.invites,10) : null, message: f.msg || null,
      });
      if (qErr) throw qErr;
      const items = cartItems.map(it => ({ quote_id: quoteId, product_id: it.product.id, quantity: it.qty }));
      const { error: iErr } = await SB.from('quote_items').insert(items);
      if (iErr) throw iErr;
      clearCart();
      setSent(true);
    } catch (e) {
      setSubmitError("Une erreur est survenue lors de l'envoi. Merci de réessayer, ou de nous contacter directement.");
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div style={{paddingTop:0,background:G.cream,minHeight:'100vh'}}>
      <div style={{position:'relative',height:isMobile?140:180,overflow:'hidden'}}>
        <img src={IMGS.gallery2} alt="Devis" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
        <div style={{position:'absolute',inset:0,background:'rgba(44,36,25,.58)',display:'flex',alignItems:'flex-end',padding:isMobile?'0 20px 24px':'0 80px 36px'}}>
          <div>
            <p style={{fontFamily:"'Jost',sans-serif",fontSize:11,letterSpacing:'.22em',textTransform:'uppercase',color:G.goldL,fontWeight:600,margin:'0 0 6px'}}><Edit k="devis_header_eyebrow">{d.devis_header_eyebrow}</Edit></p>

          <div style={{marginBottom:20}}>

                  <span>{c.label}</span>
                  <span style={{color:G.textM,fontWeight:400}}>{openCat===c.id?'−':'+'}</span>
                </button>
                {openCat===c.id && (
                  <div style={{padding:'4px 14px'}}>
                    {PRODUCTS.filter(p=>p.cat===c.id).map(p=>{
                      const qty = cart[p.id]||0;
                      return (
                        <div key={p.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid '+G.beige,gap:12}}>
                          <div style={{minWidth:0}}>
                            <div style={{fontFamily:"'Jost',sans-serif",fontSize:13,color:G.text}}>{p.name}</div>
                            <div style={{fontFamily:"'Jost',sans-serif",fontSize:11,color:G.textM}}>{p.price}</div>
                          </div>
                          <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                            <button type="button" onClick={()=>setCartQty(p.id,qty-1)} disabled={qty===0}
                              style={{width:26,height:26,border:'1px solid '+G.beigeD,background:'#fff',cursor:qty===0?'default':'pointer',color:G.text,fontSize:14,opacity:qty===0?.4:1}}>−</button>
                            <span style={{width:20,textAlign:'center',fontFamily:"'Jost',sans-serif",fontSize:13}}>{qty}</span>
                            <button type="button" onClick={()=>setCartQty(p.id,qty+1)}
                              style={{width:26,height:26,border:'1px solid '+G.beigeD,background:'#fff',cursor:'pointer',color:G.text,fontSize:14}}>+</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            ))}
          </div>

          {cartItems.length>0 && (
            <div style={{background:G.beige,padding:'16px 20px',marginBottom:20}}>
              <p style={lbl}>Votre sélection</p>
              {cartItems.map(it=>(
                <div key={it.product.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontFamily:"'Jost',sans-serif",fontSize:13,color:G.text,padding:'5px 0'}}>
                  <span>{it.qty} × {it.product.name}</span>
                  <span onClick={()=>setCartQty(it.product.id,0)} style={{cursor:'pointer',color:G.textM,fontSize:11,textDecoration:'underline'}}>Retirer</span>
                </div>
              ))}
            </div>
          )}
          <div style={{marginBottom:20}}><label style={lbl}>Message & précisions</label><textarea value={f.msg} onChange={e=>set('msg',e.target.value)} rows={5} style={{...inp,resize:'vertical'}} placeholder="Décrivez votre vision, vos couleurs, votre lieu…"/></div>
          <div style={{background:G.beige,padding:'20px 24px',marginBottom:24,borderLeft:'4px solid '+G.sage}}>
            <p style={{fontFamily:"'Jost',sans-serif",fontSize:10,letterSpacing:'.12em',textTransform:'uppercase',color:G.sage,fontWeight:600,margin:'0 0 12px'}}>Tarifs indicatifs</p>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(3,1fr)',gap:16}}>
              {[['Pack Essentiel','dès 450€/j','≤ 50 pers.'],['Pack Standard','dès 750€/j','≤ 80 pers.'],['Pack Prestige','dès 950€/j','100+ pers.']].map(([n,p,s])=>(
                <div key={n} style={{textAlign:'center',background:G.cream,padding:'14px'}}>
                  <div style={{fontFamily:"'Jost',sans-serif",fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',color:G.sage,fontWeight:600,marginBottom:4}}>{n}</div>
                  <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:G.gold,fontWeight:700}}>{p}</div>
                  <div style={{fontFamily:"'Jost',sans-serif",fontSize:10,color:G.textM,marginTop:3}}>{s}</div>
                </div>
              ))}
            </div>
          </div>
          {submitError && (
            <div style={{background:'#FBF1F0',border:'1px solid #C4877A',color:'#8B3A2A',fontFamily:"'Jost',sans-serif",fontSize:12,padding:'10px 14px',marginBottom:14}}>{submitError}</div>
          )}
          <Btn onClick={handleSubmit} full disabled={!canSubmit} style={{padding:'14px',fontSize:12}}>
            {submitting?'Envoi en cours…':'Envoyer ma demande de devis'}
          </Btn>
          {cartItems.length===0 && (
            <p style={{fontFamily:"'Jost',sans-serif",fontSize:11,color:'#8B3A2A',textAlign:'center',marginTop:10}}>Sélectionnez au moins un article ci-dessus pour envoyer votre demande.</p>
          )}
          <p style={{fontFamily:"'Jost',sans-serif",fontSize:11,color:G.textM,textAlign:'center',marginTop:10}}><Edit k="devis_footer_note">{d.devis_footer_note}</Edit></p>
        </div>
      )}
    </div>
  );
}

// APP
// ═══════════════════════════════════════════════════════════════════════════════
function App() {
  const [page,setPage] = React.useState(()=>localStorage.getItem('lw_page')||'home');
  const navigate = p => setPage(p);

  // Panier de devis : { [productId]: quantite }, persiste en localStorage.
  const [cart,setCart] = React.useState(()=>{
    try { return JSON.parse(localStorage.getItem('lw_cart')) || {}; } catch { return {}; }
  });
  React.useEffect(()=>{ localStorage.setItem('lw_cart', JSON.stringify(cart)); },[cart]);
  const setCartQty = (productId, qty) => setCart(c => {
    const n = Math.max(0, qty|0);
    const next = {...c};
    if (n === 0) delete next[productId]; else next[productId] = n;
    return next;
  });
  const addToCart = (productId, qty=1) => setCartQty(productId, (cart[productId]||0) + qty);
  const clearCart = () => setCart({});

  React.useEffect(()=>{
    localStorage.setItem('lw_page',page);
    const el = document.getElementById('app-scroll');
    if (el) el.scrollTop = 0;
  },[page]);

  const navPage = page.startsWith('cat_') ? 'catalogue' : page;

  return (
    <div id="app-scroll">
      {page==='home'      && <HomePage setPage={navigate} addToCart={addToCart}/>}
      {(page==='catalogue'||page.startsWith('cat_')) && <CataloguePage setPage={navigate} initialCat={page.startsWith('cat_')?page.replace('cat_',''):'all'} addToCart={addToCart}/>}
      {page==='how'       && <HowPage setPage={navigate}/>}
      {page==='about'     && <AboutPage setPage={navigate}/>}
      {page==='devis'     && <DevisPage cart={cart} setCartQty={setCartQty} clearCart={clearCart}/>}
      {page==='contact'   && <ContactPage/>}
      <Footer setPage={navigate}/>
      <BottomNav page={navPage} setPage={navigate}/>
    </div>
  );
}

// ── RACINE ────────────────────────────────────────────────────────────────────
// EditModeProvider enveloppe toute l'app : il ne change rien au rendu de <App/>
// (il fournit juste un contexte avec editMode=false par défaut). EditLauncher
// est le seul ajout visible pour un visiteur normal (petit bouton crayon en
// bas à droite) ; EditToolbar ne rend rien tant que le mode édition est inactif.
function Root() {
  return (
    <EditModeProvider>
      <App/>
      <EditLauncher/>
      <EditToolbar/>
    </EditModeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);

</script>
